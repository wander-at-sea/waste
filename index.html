<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Drive, Sevenoaks &mdash; Garden Waste</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 18px/1.5 system-ui, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      h1 {
        font-size: 1.1rem;
        font-weight: 600;
        opacity: 0.7;
        margin: 0 0 1rem;
      }
      .answer-label {
        font-size: 0.95rem;
        margin: 0 0 0.35rem;
      }
      .answer {
        font-size: 1.6rem;
        font-weight: 700;
        line-height: 1.3;
      }
      .muted {
        opacity: 0.65;
        font-size: 0.95rem;
      }
      .error {
        color: #c0392b;
        font-size: 1rem;
        text-align: left;
        white-space: pre-wrap;
      }
      img {
        max-width: 100%;
        border-radius: 0.5rem;
        margin-top: 1rem;
      }
      details {
        text-align: left;
        margin-top: 1rem;
        font-size: 0.85rem;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: rgba(127, 127, 127, 0.12);
        padding: 0.6rem;
        border-radius: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>The Drive, Sevenoaks &mdash; Garden Waste</h1>
      <div id="result" class="muted">Checking…</div>
    </main>
    <script>
      const el = document.getElementById('result')
      const STORAGE_KEY = 'wasteCollection'
      const MONTHS = [
        'january', 'february', 'march', 'april', 'may', 'june',
        'july', 'august', 'september', 'october', 'november', 'december',
      ]

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
      }

      function debugHtml(data) {
        let html = ''
        if (data.cardText) {
          html +=
            '<details><summary>Card text (what the scraper read)</summary><pre>' +
            escapeHtml(data.cardText) +
            '</pre></details>'
        }
        if (data.cardHtml) {
          html +=
            '<details><summary>Card HTML</summary><pre>' + escapeHtml(data.cardHtml) + '</pre></details>'
        }
        return html
      }

      // Parses the scraped "Friday 04 September 2026" format into a local Date
      // (midnight). Returns null if the text isn't in that shape.
      function parseCollectionDate(text) {
        if (!text) return null
        const parts = text.trim().split(/\s+/)
        if (parts.length < 4) return null
        const day = parseInt(parts[1], 10)
        const monthIndex = MONTHS.indexOf(parts[2].toLowerCase())
        const year = parseInt(parts[3], 10)
        if (Number.isNaN(day) || monthIndex === -1 || Number.isNaN(year)) return null
        return new Date(year, monthIndex, day)
      }

      function startOfToday() {
        const d = new Date()
        d.setHours(0, 0, 0, 0)
        return d
      }

      function loadCache() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY)
          if (!raw) return null
          const parsed = JSON.parse(raw)
          return parsed && parsed.nextCollectionDay ? parsed : null
        } catch {
          return null
        }
      }

      function saveCache(nextCollectionDay) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ nextCollectionDay }))
        } catch {
          // ignore storage failures (private browsing, quota, etc.)
        }
      }

      function showAnswer(nextCollectionDay, data) {
        el.innerHTML =
          '<p class="answer-label">Your next garden waste collection date is</p>' +
          '<div class="answer">' +
          (nextCollectionDay || '(not found — see debug info below)') +
          '</div>' +
          (nextCollectionDay ? '' : debugHtml(data || {}))
      }

      function fetchFresh() {
        el.innerHTML = '<p class="muted">Just checking now…</p>'
        fetch('/api/collection-day')
          .then((r) => r.json().then((data) => ({ ok: r.ok, data })))
          .then(({ ok, data }) => {
            if (!ok || !data.success) {
              el.innerHTML =
                '<p class="error">Lookup failed at step "' +
                (data.step || 'unknown') +
                '": ' +
                (data.message || 'unknown error') +
                '</p>' +
                (data.screenshot ? '<img src="' + data.screenshot + '" alt="Failure screenshot" />' : '') +
                debugHtml(data)
              return
            }
            if (data.nextCollectionDay) saveCache(data.nextCollectionDay)
            showAnswer(data.nextCollectionDay, data)
          })
          .catch((err) => {
            el.innerHTML = '<p class="error">Request failed: ' + err.message + '</p>'
          })
      }

      const cached = loadCache()
      const cachedDate = cached ? parseCollectionDate(cached.nextCollectionDay) : null

      if (cachedDate && cachedDate >= startOfToday()) {
        // Cached date hasn't passed yet — show it without hitting the council site again.
        showAnswer(cached.nextCollectionDay, null)
      } else {
        // No cache, unparseable cache, or the stored date has already passed — go check.
        fetchFresh()
      }
    </script>
  </body>
</html>
