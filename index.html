<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Drive</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 18px/1.5 system-ui, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      h1 {
        font-size: 1.1rem;
        font-weight: 600;
        opacity: 0.7;
        margin: 0 0 1rem;
      }
      .answer-label {
        font-size: 0.95rem;
        margin: 0 0 0.35rem;
      }
      .answer-when {
        font-size: 1.2rem;
        font-weight: 700;
        line-height: 1.3;
      }
      .answer-date {
        font-size: 1.6rem;
        font-weight: 700;
        line-height: 1.3;
      }
      .quiet-link {
        color: inherit;
        text-decoration: none;
      }
      .muted {
        opacity: 0.65;
        font-size: 0.95rem;
      }
      .error {
        color: #c0392b;
        font-size: 1rem;
        text-align: left;
        white-space: pre-wrap;
      }
      img {
        max-width: 100%;
        border-radius: 0.5rem;
        margin-top: 1rem;
      }
      details {
        text-align: left;
        margin-top: 1rem;
        font-size: 0.85rem;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: rgba(127, 127, 127, 0.12);
        padding: 0.6rem;
        border-radius: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>The Drive</h1>
      <div id="result" class="muted">Checking…</div>
    </main>
    <script>
      const el = document.getElementById('result')
      const STORAGE_KEY = 'wasteCollection'
      const MONTHS = [
        'january', 'february', 'march', 'april', 'may', 'june',
        'july', 'august', 'september', 'october', 'november', 'december',
      ]
      const WEEKDAYS = [
        'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday',
      ]

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
      }

      function debugHtml(data) {
        let html = ''
        if (data.cardText) {
          html +=
            '<details><summary>Card text (what the scraper read)</summary><pre>' +
            escapeHtml(data.cardText) +
            '</pre></details>'
        }
        if (data.cardHtml) {
          html +=
            '<details><summary>Card HTML</summary><pre>' + escapeHtml(data.cardHtml) + '</pre></details>'
        }
        return html
      }

      // Parses the scraped "Friday 04 September 2026" format into a local Date
      // (midnight). Returns null if the text isn't in that shape.
      function parseCollectionDate(text) {
        if (!text) return null
        const parts = text.trim().split(/\s+/)
        if (parts.length < 4) return null
        const day = parseInt(parts[1], 10)
        const monthIndex = MONTHS.indexOf(parts[2].toLowerCase())
        const year = parseInt(parts[3], 10)
        if (Number.isNaN(day) || monthIndex === -1 || Number.isNaN(year)) return null
        return new Date(year, monthIndex, day)
      }

      function startOfDay(d) {
        const copy = new Date(d)
        copy.setHours(0, 0, 0, 0)
        return copy
      }

      function startOfToday() {
        return startOfDay(new Date())
      }

      function addDays(d, n) {
        const copy = new Date(d)
        copy.setDate(copy.getDate() + n)
        return copy
      }

      function daysBetween(a, b) {
        return Math.round((b - a) / 86400000)
      }

      // "Today (Thursday)" / "Tomorrow (Friday)" / "This Saturday" / "Next Monday" / "Monday".
      // On a weekday, "This" runs through the coming Sunday. On a weekend, people already
      // think of the coming week as "this" week, so the cutoff shifts to the coming Friday
      // instead (see /explainer.html). "Next" is the following 7-day block; beyond that it's
      // just the plain day name.
      function describeDate(target, today) {
        const t = startOfDay(target)
        const now = startOfDay(today)
        const diff = daysBetween(now, t)
        const weekday = WEEKDAYS[t.getDay()]

        if (diff === 0) return { label: null, weekday, parenthesise: 'Today' }
        if (diff === 1) return { label: null, weekday, parenthesise: 'Tomorrow' }

        const todayDow = now.getDay()
        const isWeekend = todayDow === 0 || todayDow === 6
        const cutoffDow = isWeekend ? 5 : 0 // Friday : Sunday
        const daysUntilCutoff1 = ((cutoffDow - todayDow) % 7 + 7) % 7
        const cutoff1 = addDays(now, daysUntilCutoff1)
        const cutoff2 = addDays(cutoff1, 7)

        let label = null
        if (t <= cutoff1) label = 'This'
        else if (t <= cutoff2) label = 'Next'

        return { label, weekday, parenthesise: null }
      }

      function describeDateHtml(target, today) {
        const d = describeDate(target, today)
        if (d.parenthesise) {
          return escapeHtml(d.parenthesise) + ' (' + escapeHtml(d.weekday) + ')'
        }
        if (d.label) {
          return (
            '<a class="quiet-link" href="/explainer.html">' +
            escapeHtml(d.label) +
            '</a> ' +
            escapeHtml(d.weekday)
          )
        }
        return escapeHtml(d.weekday)
      }

      // "Friday 04 September 2026" -> "4 September 2026" (drop the weekday, no leading zero).
      function formatDateLine(text) {
        const parts = text.trim().split(/\s+/)
        if (parts.length < 4) return text
        const day = parseInt(parts[1], 10)
        return (Number.isNaN(day) ? parts[1] : String(day)) + ' ' + parts[2] + ' ' + parts[3]
      }

      function loadCache() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY)
          if (!raw) return null
          const parsed = JSON.parse(raw)
          return parsed && parsed.nextCollectionDay ? parsed : null
        } catch {
          return null
        }
      }

      function saveCache(nextCollectionDay) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ nextCollectionDay }))
        } catch {
          // ignore storage failures (private browsing, quota, etc.)
        }
      }

      function showAnswer(nextCollectionDay, data) {
        const parsed = parseCollectionDate(nextCollectionDay)
        if (!parsed) {
          el.innerHTML =
            '<p class="answer-label">Your next garden waste collection date is</p>' +
            '<div class="answer-date">' +
            (nextCollectionDay || '(not found — see debug info below)') +
            '</div>' +
            debugHtml(data || {})
          return
        }
        el.innerHTML =
          '<p class="answer-label">Your next garden waste collection date is</p>' +
          '<div class="answer-when">' + describeDateHtml(parsed, new Date()) + '</div>' +
          '<div class="answer-date">' + escapeHtml(formatDateLine(nextCollectionDay)) + '</div>'
      }

      function fetchFresh() {
        el.innerHTML = '<p class="muted">Just checking now…</p>'
        fetch('/api/collection-day')
          .then((r) => r.json().then((data) => ({ ok: r.ok, data })))
          .then(({ ok, data }) => {
            if (!ok || !data.success) {
              el.innerHTML =
                '<p class="error">Lookup failed at step "' +
                (data.step || 'unknown') +
                '": ' +
                (data.message || 'unknown error') +
                '</p>' +
                (data.screenshot ? '<img src="' + data.screenshot + '" alt="Failure screenshot" />' : '') +
                debugHtml(data)
              return
            }
            if (data.nextCollectionDay) saveCache(data.nextCollectionDay)
            showAnswer(data.nextCollectionDay, data)
          })
          .catch((err) => {
            el.innerHTML = '<p class="error">Request failed: ' + err.message + '</p>'
          })
      }

      const cached = loadCache()
      const cachedDate = cached ? parseCollectionDate(cached.nextCollectionDay) : null

      if (cachedDate && cachedDate >= startOfToday()) {
        // Cached date hasn't passed yet — show it without hitting the council site again.
        showAnswer(cached.nextCollectionDay, null)
      } else {
        // No cache, unparseable cache, or the stored date has already passed — go check.
        fetchFresh()
      }
    </script>
  </body>
</html>
